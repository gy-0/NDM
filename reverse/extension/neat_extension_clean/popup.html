<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 280px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }
        h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #333;
        }
        .section {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }
        .toggle-label {
            font-size: 13px;
            color: #555;
        }
        .toggle-label small {
            display: block;
            color: #999;
            font-size: 11px;
            margin-top: 2px;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .status {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 4px;
            margin-top: 8px;
        }
        .status.on {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status.off {
            background: #f5f5f5;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="section">
        <h3>📥 下载捕获设置</h3>
        <div class="toggle-row">
            <span class="toggle-label">
                接管浏览器下载
                <small>自动拦截下载链接</small>
            </span>
            <label class="switch">
                <input type="checkbox" id="catchDownloads">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="section">
        <h3>🔍 媒体嗅探设置</h3>
        <div class="toggle-row">
            <span class="toggle-label">
                显示媒体下载按钮
                <small>在视频/音频上显示浮动面板</small>
            </span>
            <label class="switch">
                <input type="checkbox" id="showMediaPanel">
                <span class="slider"></span>
            </label>
        </div>
        <div id="mediaStatus" class="status off">媒体嗅探已关闭</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
