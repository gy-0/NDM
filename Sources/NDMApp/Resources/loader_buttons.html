<!DOCTYPE html>
<html lang="zh-CN" aria-hidden="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDM Loader Buttons</title>
<style>
  /* Appllama loader-button chrome — lifted verbatim from loader-buttons.appllama.io
     so the buttons in NDM are pixel-identical to the reference site. */
  :root {
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --ndm-accent: #1e5dda;
    --ndm-accent-border: rgba(30, 93, 218, 0.38);
    --ndm-accent-shadow: rgba(30, 93, 218, 0.16);
    --ndm-ink: #2b2a28;
    --ndm-fill: #fffefa;
    --ndm-fill-hover: #ffffff;
    --ndm-border: rgba(54, 50, 46, 0.13);
    --ndm-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset,
      0 0 0 0.5px rgba(255, 255, 255, 0.42) inset,
      0 6px 16px rgba(45, 39, 32, 0.09);
    --ink: var(--ndm-ink);
  }
  html[data-appearance="dark"] {
    --ndm-ink: #f1f4f9;
    --ndm-fill: #181d27;
    --ndm-fill-hover: #202735;
    --ndm-border: rgba(255, 255, 255, 0.14);
    --ndm-shadow: 0 1px 0 rgba(255, 255, 255, 0.10) inset,
      0 0 0 0.5px rgba(255, 255, 255, 0.05) inset,
      0 8px 20px rgba(0, 0, 0, 0.34);
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
  }
  #gallery {
    display: none;
  }

  /* ---- single phase button ---- */
  #phase-button {
    position: relative;
    z-index: 0;
    display: flex;
    width: 172px;
    height: 40px;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    overflow: visible;
    border: 1px solid var(--ndm-border);
    border-radius: 9999px;
    background: var(--ndm-fill);
    box-shadow: var(--ndm-shadow);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    cursor: pointer;
    isolation: isolate;
    transform: translateZ(0) scale(1);
    transition:
      transform 0.34s var(--ease-out-quart),
      background 0.22s ease,
      border-color 0.22s ease,
      box-shadow 0.22s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #phase-button.ndm-hover {
    border-color: var(--ndm-accent-border);
    background: var(--ndm-fill-hover);
    box-shadow: var(--ndm-shadow), 0 8px 22px var(--ndm-accent-shadow);
  }
  #phase-button:active,
  #phase-button.ndm-pressed {
    transition-duration: 90ms;
  }
  #phase-button .button-content {
    position: relative;
    z-index: 2;
    display: flex;
    width: 100%;
    height: 100%;
    padding: 0 12px;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border-radius: inherit;
  }
  #phase-button .loader-slot {
    position: relative;
    display: block;
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    contain: strict;
    color: var(--ink);
  }
  #phase-button .loader-label {
    position: relative;
    min-width: 0;
    white-space: nowrap;
    color: var(--ndm-ink);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.14px;
    line-height: 20px;
    transition: color 0.2s ease;
  }
  #phase-button .button-sheen,
  #phase-button .button-rim {
    position: absolute;
    display: block;
    border-radius: inherit;
    pointer-events: none;
  }
  #phase-button .button-sheen {
    z-index: 3;
    inset: 0.6px;
    overflow: clip;
    background: linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.5) 40%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0) 55%
      )
      no-repeat 0% 50% / 200% 200%;
    mix-blend-mode: soft-light;
    transition: background-position 0.45s var(--ease-out-quart);
  }
  #phase-button .button-rim {
    --rim-angle: -75deg;
    z-index: 1;
    inset: -0.5px;
    padding: 1px;
    background:
      conic-gradient(
        from var(--rim-angle),
        rgba(0, 0, 0, 0.5),
        rgba(0, 0, 0, 0) 5%,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.5) 50%,
        rgba(0, 0, 0, 0) 60%,
        rgba(0, 0, 0, 0) 95%,
        rgba(0, 0, 0, 0.5)
      ),
      linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5));
    box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.35) inset;
    transition: --rim-angle 0.45s var(--ease-out-quart);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
  #phase-button.ndm-hover .loader-label { color: var(--ndm-accent); }
  #phase-button.ndm-hover .button-sheen { background-position: 28% 50%; }
  #phase-button.ndm-hover .button-rim { --rim-angle: -125deg; }
  html[data-mode="glyph"] #phase-button {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  html[data-mode="glyph"] #phase-button .button-content {
    padding: 0;
    gap: 0;
  }
  html[data-mode="glyph"] #phase-button .loader-slot {
    width: 26px;
    height: 26px;
    flex-basis: 26px;
  }
  html[data-mode="glyph"] #phase-button .loader-label,
  html[data-mode="glyph"] #phase-button .button-sheen,
  html[data-mode="glyph"] #phase-button .button-rim {
    display: none;
  }
  .visual-canvas, .visual-svg, .visual-dom {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---- gallery (all 25, like the site) ---- */
  #gallery {
    flex-wrap: wrap;
    gap: 18px;
    padding: 24px;
    align-content: flex-start;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: auto;
    box-sizing: border-box;
  }
  .specimen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .specimen-name {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    color: #444;
  }
  .loader-button {
    position: relative;
    z-index: 0;
    display: flex;
    width: 150px;
    height: 58px;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    overflow: visible;
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 9999px;
    background:
      linear-gradient(-75deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1)),
      rgba(255, 255, 255, 0.55);
    box-shadow:
      0 1px 4px rgba(255, 255, 255, 0.667) inset,
      0 -4px 4px rgba(255, 255, 255, 0.85) inset,
      0 0 14px rgba(229, 229, 229, 0.55) inset,
      0 11px 28px rgba(0, 0, 0, 0.07),
      0 23px 31px rgba(0, 0, 0, 0.05);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    cursor: pointer;
    isolation: isolate;
    transform: translateZ(0) scale(1);
    transition: transform 0.4s var(--ease-out-quart);
    -webkit-tap-highlight-color: transparent;
  }
  .loader-button:hover { transform: translateZ(0) scale(0.975); }
  .loader-button:active { transform: translateZ(0) scale(0.975); transition-duration: 110ms; }
  .loader-button .button-content {
    position: relative; z-index: 2;
    display: flex; width: 100%; height: 100%;
    padding: 0 13.3px; align-items: center; justify-content: center;
    gap: 9px; border-radius: inherit;
  }
  .loader-button .loader-slot {
    position: relative; display: block;
    width: 30px; height: 30px; flex: 0 0 30px;
    contain: strict; color: var(--ink);
  }
  .loader-button .loader-label {
    position: relative; min-width: 0; white-space: nowrap;
    color: #363636; font-size: 19px; font-weight: 400;
    letter-spacing: -0.19px; line-height: 28.5px;
  }
  .loader-button .button-sheen,
  .loader-button .button-rim {
    position: absolute; display: block; border-radius: inherit; pointer-events: none;
  }
  .loader-button .button-sheen {
    z-index: 3; inset: 0.6px; overflow: clip;
    background: linear-gradient(-45deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 40%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 55%) no-repeat 0% 50% / 200% 200%;
    mix-blend-mode: soft-light;
    transition: background-position 0.5s var(--ease-out-quart);
  }
  .loader-button:hover .button-sheen { background-position: 25% 50%; }
  .loader-button .button-rim {
    --rim-angle: -75deg; z-index: 1; inset: -0.5px; padding: 1px;
    background:
      conic-gradient(from var(--rim-angle), rgba(0,0,0,0.5), rgba(0,0,0,0) 5%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,0) 95%, rgba(0,0,0,0.5)),
      linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5));
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.35) inset;
    transition: --rim-angle 0.5s var(--ease-out-quart);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
  .loader-button:hover .button-rim { --rim-angle: -125deg; }
</style>

<body inert aria-hidden="true">
  <div id="stage">
    <div id="phase-button" role="presentation" aria-hidden="true">
      <span class="button-content">
        <span class="loader-slot" aria-hidden="true"></span>
        <span class="loader-label">下载</span>
      </span>
      <span class="button-sheen" aria-hidden="true"></span>
      <span class="button-rim" aria-hidden="true"></span>
    </div>
    <div id="gallery"></div>
  </div>

    <script>
// Appllama loader-button library, bundled verbatim from
// https://loader-buttons.appllama.io/ — non-commercial design reference.
const { createShaderVisual, createCanvasVisual, SharedMicroRenderer } = (() => {
function createCanvasVisual(container, draw, options = {}) {
  const canvas = document.createElement("canvas");
  canvas.className = "visual-canvas";
  canvas.setAttribute("aria-hidden", "true");
  container.append(canvas);

  const context = canvas.getContext("2d", {
    alpha: true,
    desynchronized: true,
  });

  let width = 1;
  let height = 1;
  let dpr = 1;

  function resize(nextWidth, nextHeight, nextDpr = window.devicePixelRatio || 1) {
    width = Math.max(1, nextWidth);
    height = Math.max(1, nextHeight);
    dpr = Math.min(options.maxDpr ?? 3, Math.max(1, nextDpr));
    const pixelWidth = Math.max(1, Math.round(width * dpr));
    const pixelHeight = Math.max(1, Math.round(height * dpr));

    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
  }

  return {
    render(time, delta) {
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      context.clearRect(0, 0, width, height);
      context.save();
      draw(context, time, delta, width, height);
      context.restore();
    },
    resize,
    reset() {},
    destroy() {
      canvas.remove();
    },
  };
}


const VERTEX_SOURCE = `#version 300 es
precision highp float;

const vec2 POSITIONS[3] = vec2[3](
  vec2(-1.0, -1.0),
  vec2(3.0, -1.0),
  vec2(-1.0, 3.0)
);

void main() {
  gl_Position = vec4(POSITIONS[gl_VertexID], 0.0, 1.0);
}
`;

function makeFragmentSource(shaderBody) {
  return `#version 300 es
precision highp float;

uniform vec2 u_resolution;
uniform float u_time;
uniform float u_seed;
out vec4 outColor;

${shaderBody}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
  outColor = shade(uv, u_time, u_seed);
}
`;
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);

  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const message = gl.getShaderInfoLog(shader) || "Unknown shader compilation error";
    gl.deleteShader(shader);
    throw new Error(message);
  }

  return shader;
}

function link(gl, vertexShader, fragmentShader) {
  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const message = gl.getProgramInfoLog(program) || "Unknown shader link error";
    gl.deleteProgram(program);
    throw new Error(message);
  }

  return program;
}

class SharedMicroRenderer {
  constructor() {
    this.canvas = document.createElement("canvas");
    this.canvas.width = 1;
    this.canvas.height = 1;
    this.gl = this.canvas.getContext("webgl2", {
      alpha: true,
      antialias: false,
      depth: false,
      desynchronized: true,
      // These shaders render into small micro-canvases; favor the integrated GPU
      // so opening the gallery does not wake a discrete/high-power graphics path.
      powerPreference: "low-power",
      premultipliedAlpha: false,
      preserveDrawingBuffer: false,
      stencil: false,
    });

    if (!this.gl) throw new Error("WebGL 2 is unavailable");

    this.vertexShader = compile(this.gl, this.gl.VERTEX_SHADER, VERTEX_SOURCE);
    this.gl.disable(this.gl.BLEND);
    this.gl.disable(this.gl.DEPTH_TEST);
    this.gl.disable(this.gl.CULL_FACE);
    this.gl.clearColor(0, 0, 0, 0);
  }

  register(config) {
    const fragmentShader = compile(
      this.gl,
      this.gl.FRAGMENT_SHADER,
      makeFragmentSource(config.fragment),
    );
    const program = link(this.gl, this.vertexShader, fragmentShader);

    return {
      fragmentShader,
      program,
      resolutionLocation: this.gl.getUniformLocation(program, "u_resolution"),
      timeLocation: this.gl.getUniformLocation(program, "u_time"),
      seedLocation: this.gl.getUniformLocation(program, "u_seed"),
      seed: Number.isFinite(config.seed) ? config.seed : 1,
    };
  }

  draw(entry, width, height, time) {
    const gl = this.gl;

    if (this.canvas.width !== width || this.canvas.height !== height) {
      this.canvas.width = width;
      this.canvas.height = height;
      gl.viewport(0, 0, width, height);
    }

    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(entry.program);
    gl.uniform2f(entry.resolutionLocation, width, height);
    gl.uniform1f(entry.timeLocation, time);
    gl.uniform1f(entry.seedLocation, entry.seed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    return this.canvas;
  }

  release(entry) {
    this.gl.deleteProgram(entry.program);
    this.gl.deleteShader(entry.fragmentShader);
  }
}

let sharedRenderer;
let rendererFailure;

function getSharedRenderer() {
  if (sharedRenderer) return sharedRenderer;
  if (rendererFailure) throw rendererFailure;

  try {
    sharedRenderer = new SharedMicroRenderer();
    return sharedRenderer;
  } catch (error) {
    rendererFailure = error;
    throw error;
  }
}

function defaultFallback(context, time, _delta, width, height) {
  const size = Math.min(width, height);
  const radius = size * 0.27;
  const count = 12;
  const cx = width / 2;
  const cy = height / 2;

  context.fillStyle = "#191919";
  for (let index = 0; index < count; index += 1) {
    const phase = index / count;
    const angle = phase * Math.PI * 2 - time * 2.4;
    context.globalAlpha = 0.16 + 0.84 * ((phase + time * 0.38) % 1);
    context.beginPath();
    context.arc(
      cx + Math.cos(angle) * radius,
      cy + Math.sin(angle) * radius,
      size * (0.018 + phase * 0.025),
      0,
      Math.PI * 2,
    );
    context.fill();
  }
}

function createShaderVisual(container, config) {
  let renderer;
  let entry;

  try {
    renderer = getSharedRenderer();
    entry = renderer.register(config);
  } catch (error) {
    console.error(`[${config.name ?? "WebGL loader"}]`, error);
    return createCanvasVisual(container, config.fallback ?? defaultFallback, {
      maxDpr: config.maxDpr ?? 3,
    });
  }

  const canvas = document.createElement("canvas");
  canvas.className = "visual-canvas";
  canvas.setAttribute("aria-hidden", "true");
  container.append(canvas);

  const context = canvas.getContext("2d", {
    alpha: true,
    desynchronized: true,
  });

  let width = 1;
  let height = 1;
  let dpr = 1;

  function resize(nextWidth, nextHeight, nextDpr = window.devicePixelRatio || 1) {
    width = Math.max(1, nextWidth);
    height = Math.max(1, nextHeight);
    const defaultCap = 3;
    dpr = Math.min(config.maxDpr ?? defaultCap, Math.max(1, nextDpr));
    const pixelWidth = Math.max(1, Math.round(width * dpr));
    const pixelHeight = Math.max(1, Math.round(height * dpr));

    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
  }

  return {
    render(time) {
      const source = renderer.draw(entry, canvas.width, canvas.height, time);
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(source, 0, 0, canvas.width, canvas.height);
    },
    resize,
    reset() {},
    destroy() {
      renderer.release(entry);
      canvas.remove();
    },
  };
}

  return { createShaderVisual, createCanvasVisual, SharedMicroRenderer };
})();

function makeDesigns() {
  const list = [];
  list.push((() => {

const LOOP_SECONDS = 3.6;
const POINT_COUNT = 96;
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
const TAU = Math.PI * 2;

const fallbackPoints = Array.from({ length: POINT_COUNT }, (_, index) => {
  const y = 1 - (2 * (index + 0.5)) / POINT_COUNT;
  const radius = Math.sqrt(Math.max(0, 1 - y * y));
  const azimuth = index * GOLDEN_ANGLE + 0.31;
  return [Math.cos(azimuth) * radius, y, Math.sin(azimuth) * radius];
});

function smoothstep(edge0, edge1, value) {
  const amount = Math.min(1, Math.max(0, (value - edge0) / (edge1 - edge0)));
  return amount * amount * (3 - 2 * amount);
}

function rotatePoint([x, y, z], phase) {
  const yaw = TAU * phase;
  const nod = 0.13 * Math.sin(TAU * phase);
  const lean = 0.075 * Math.cos(TAU * phase);

  const yawX = x * Math.cos(yaw) + z * Math.sin(yaw);
  const yawZ = -x * Math.sin(yaw) + z * Math.cos(yaw);
  const nodY = y * Math.cos(nod) - yawZ * Math.sin(nod);
  const nodZ = y * Math.sin(nod) + yawZ * Math.cos(nod);

  return [
    yawX * Math.cos(lean) - nodY * Math.sin(lean),
    yawX * Math.sin(lean) + nodY * Math.cos(lean),
    nodZ,
  ];
}

function deformationAt(y, phase) {
  // Twenty discrete latitude bands make the crest hand-off every ~80 ms.
  const latitude = (1 - y) * 0.5;
  const band = Math.floor(Math.min(0.9999, latitude) * 20) / 19;
  const arrival = 0.165 + band * 0.42;
  const squeeze =
    smoothstep(arrival - 0.05, arrival + 0.024, phase) *
    (1 - smoothstep(arrival + 0.105, arrival + 0.17, phase));
  const rebound =
    smoothstep(arrival + 0.095, arrival + 0.165, phase) *
    (1 - smoothstep(arrival + 0.2, arrival + 0.285, phase));
  const farPole = smoothstep(0.73, 1, latitude);

  return {
    latitude,
    squeeze,
    rebound,
    scale: 1 - 0.255 * squeeze + (0.074 + 0.058 * farPole) * rebound,
  };
}

function drawFallback(context, time, _delta, width, height) {
  const phase = ((time / LOOP_SECONDS) % 1 + 1) % 1;
  const size = Math.min(width, height);
  const globeRadius = size * 0.39;
  const cx = width * 0.5;
  const cy = height * 0.5;

  // Two depth passes preserve the rear shell without letting it muddy the face.
  for (let pass = 0; pass < 2; pass += 1) {
    for (let index = 0; index < fallbackPoints.length; index += 1) {
      const source = fallbackPoints[index];
      const motion = deformationAt(source[1], phase);
      const radial = motion.scale;
      const pinched = 1 - 0.07 * motion.squeeze;
      const point = rotatePoint(
        [source[0] * radial * pinched, source[1] * radial, source[2] * radial * pinched],
        phase,
      );
      const front = point[2] >= 0;
      if ((pass === 0) === front) continue;

      const depth = Math.min(1, Math.max(0, point[2] * 0.5 + 0.5));
      const perspective = 1 / (1 - 0.12 * point[2]);
      const crest = motion.squeeze * smoothstep(0.86, 0.96, depth);
      const pearl = crest ** 3;
      const tone = Math.round(122 + (25 - 122) * depth);
      const alpha = 0.45 + 0.49 * depth;
      const radius = size * (0.0093 + 0.0087 * depth + 0.0016 * motion.rebound);

      context.beginPath();
      context.arc(
        cx + point[0] * globeRadius * perspective,
        cy - point[1] * globeRadius * perspective,
        radius,
        0,
        TAU,
      );
      context.fillStyle = pearl > 0.28
        ? `rgba(250, 250, 247, ${0.72 + pearl * 0.22})`
        : `rgba(${tone}, ${tone}, ${tone}, ${alpha})`;
      context.fill();
    }
  }
}

const fragment = `
const float PI = 3.141592653589793;
const float TAU = 6.283185307179586;
const float LOOP = 3.6;
const int BEADS = 96;
const float GOLDEN_ANGLE = 2.399963229728653;

mat2 rotate2d(float angle) {
  float sine = sin(angle);
  float cosine = cos(angle);
  return mat2(cosine, -sine, sine, cosine);
}

float pulse(float value, float rise0, float rise1, float fall0, float fall1) {
  return smoothstep(rise0, rise1, value) * (1.0 - smoothstep(fall0, fall1, value));
}

vec4 shade(vec2 uv, float time, float seed) {

        C 15.69 16.09 15.16 16.11 14.82 15.76
        C 14.61 15.54 14.54 15.22 14.61 14.94
        L 15 3.48 Z" />
      <path class="blade-bevel" d="M 15.34 4.04
        C 18.65 4.28 21.63 5.78 23.48 8.49
        L 15.82 15.34" />

`).join("");

const bearingMarkup = STATION_ANGLES.map((stationAngle) => `
  <g transform="rotate(${stationAngle} ${CENTER} ${CENTER})">
    <circle class="bearing" cx="15" cy="3.98" r="0.36" />

`).join("");

const markup = /* html */ `
  <svg viewBox="0 0 30 30" role="presentation" aria-hidden="true" focusable="false">

return {
  id: "mechanical-iris",
  name: "Mechanical Iris",
  kind: "svg",
  technique: "Six-lamella hinged aperture",
  label: "Opening",
  phaseOffset: 2401,
  mount(container) {
    const documentRef = container.ownerDocument;
    const host = documentRef.createElement("span");
    const shadowRoot = host.attachShadow({ mode: "closed" });
    const style = documentRef.createElement("style");
    const shell = documentRef.createElement("span");

    style.textContent = styles;
    shell.innerHTML = markup;

      if (destroyed) return;

      if (loopTime === lastTime) return;
      lastTime = loopTime;

      let collectiveClosure = 1;
      for (let index = 0; index < BLADE_COUNT; index += 1) {
        const state = bladeStateAt(loopTime, index);
        collectiveClosure = Math.min(collectiveClosure, state.closure);
        blades[index].setAttribute(
          "transform",

        );
      }

      const pinholePresence = smootherstep(0.86, 0.995, collectiveClosure);

      render,

        const safeHeight = Number.isFinite(height) ? height : 30;

        host.style.width = `${size}px`;
        host.style.height = `${size}px`;
      },
      reset() {
        if (destroyed) return;
        lastTime = Number.NaN;
        render(0, 0);
      },
      destroy() {
        if (destroyed) return;
        destroyed = true;
        lastTime = Number.NaN;
        host.remove();

    };

  })());
  list.push((() => {
const DURATION = 2.9;
const FLIP_DURATION = 0.31;
const CURL_START = 0.74;
const CURL_STEP = 0.024;
const CURL_DURATION = 0.21;
const RETURN_START = 1.66;
const RETURN_DURATION = 0.36;

const FLIP_DELAYS = [
  0.035, 0.092, 0.151, 0.213, 0.278,
  0.108, 0.166, 0.224, 0.286, 0.348,
  0.179, 0.239, 0.299, 0.359, 0.419,
  0.247, 0.308, 0.369, 0.431, 0.493,
  0.316, 0.378, 0.439, 0.501, 0.544,
];

// A single clockwise coil, beginning on the outer rim and ending at the center.
const CURL_ORDER = [
   0,  1,  2,  3,  4,
  15, 16, 17, 18,  5,
  14, 23, 24, 19,  6,
  13, 22, 21, 20,  7,
  12, 11, 10,  9,  8,
];

// Signed lean turns the timed spiral into a shallow fold toward the center.
const CURL_TILTS = [
  14.5, 13.2, 12.0, 10.8,  9.7,
  11.8, 10.4,  9.1,  7.9,  6.8,
   8.7,  7.2, 10.5, -7.1, -8.4,
  -9.8, -8.1, -9.3, -10.6, -11.7,
 -12.2, -13.5, -14.7, -13.4, -12.1,
];

// Center-out return timing is deliberately irregular so the final seat feels made.
const RETURN_DELAYS = [
  0.440, 0.374, 0.314, 0.351, 0.414,
  0.338, 0.220, 0.142, 0.204, 0.326,
  0.281, 0.108, 0.000, 0.087, 0.258,
  0.321, 0.183, 0.119, 0.171, 0.301,
  0.428, 0.361, 0.292, 0.337, 0.402,
];

const DOT_METRICS = Array.from({ length: 25 }, (_, index) => {
  const row = Math.floor(index / 5);
  const column = index % 5;
  const distance = Math.hypot(row - 2, column - 2);
  const proximity = Math.max(0, 1 - distance / 2.15);
  return { distance, proximity: proximity * proximity };
});

const closedRoots = new WeakMap();

const clamp01 = (value) => Math.max(0, Math.min(1, value));

const easeInOutCubic = (value) => (
  value < 0.5
    ? 4 * value * value * value
    : 1 - Math.pow(-2 * value + 2, 3) / 2
);

const easeOutBack = (value) => {
  const overshoot = 1.28;
  const shifted = value - 1;
  return 1 + (overshoot + 1) * shifted * shifted * shifted
    + overshoot * shifted * shifted;
};

const smoothstep = (edge0, edge1, value) => {
  const progress = clamp01((value - edge0) / (edge1 - edge0));
  return progress * progress * (3 - 2 * progress);
};

const pulse = (time, start, duration) => {
  const progress = clamp01((time - start) / duration);
  return Math.sin(Math.PI * progress);
};

const normalizeTime = (time) => {
  if (!Number.isFinite(time)) return 0;
  return ((time % DURATION) + DURATION) % DURATION;
};

return {
  id: "braille-flipwave",
  name: "Braille Flipwave",
  kind: "dom",
  technique: "Authored 3D dot-matrix flip choreography",
  label: "Flipping",

  mount(container) {
    let shadow = closedRoots.get(container);
    if (!shadow) {
      shadow = container.attachShadow({ mode: "closed" });
      closedRoots.set(container, shadow);
    }

    const style = document.createElement("style");
    style.textContent = `
      :host {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        contain: paint;
      }

      .stage {
        --fit: 1;
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        contain: paint layout style;
        perspective: 38px;
        perspective-origin: 50% 47%;
        pointer-events: none;
      }

      .matrix {
        position: relative;
        display: grid;
        width: 23px;
        height: 23px;
        grid-template-columns: repeat(5, 4.6px);
        grid-template-rows: repeat(5, 4.6px);
        place-items: center;
        transform: scale(var(--fit));
        transform-style: preserve-3d;
        isolation: isolate;
      }

      .matrix::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at center,
          rgba(31, 31, 30, 0.105) 0 1.12px,
          transparent 1.3px
        ) 0 0 / 4.6px 4.6px;
        transform: translateY(0.72px) scaleY(0.72);
        transform-origin: center;
        pointer-events: none;
        z-index: 0;
      }

      .dot {
        position: relative;
        width: 3.15px;
        height: 3.15px;
        border-radius: 50%;
        transform-style: preserve-3d;
        transform-origin: 50% 50% -0.24px;
        will-change: transform, opacity;
        z-index: 1;
      }

      .dot::before,
      .dot::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .dot::before {
        background: radial-gradient(
          circle at 38% 31%,
          rgba(73, 73, 71, 0.96) 0 20%,
          rgba(31, 31, 30, 0.96) 61%,
          rgba(18, 18, 18, 0.94) 100%
        );
        box-shadow: 0 0.42px 0.62px rgba(10, 10, 10, 0.24);
        transform: translateZ(0.18px);
      }

      .dot::after {
        background: radial-gradient(
          circle at 36% 29%,
          rgba(255, 255, 252, 0.96) 0 23%,
          rgba(231, 229, 223, 0.94) 60%,
          rgba(184, 184, 179, 0.9) 100%
        );
        box-shadow: 0 0.48px 0.68px rgba(25, 25, 24, 0.18);
        transform: rotateX(180deg) translateZ(0.18px);
      }
    `;

    const stage = document.createElement("div");
    stage.className = "stage";
    stage.setAttribute("aria-hidden", "true");

    const matrix = document.createElement("div");
    matrix.className = "matrix";

    const fragment = document.createDocumentFragment();
    const dots = [];
    const lastTransforms = Array(25).fill("");
    const lastOpacities = Array(25).fill("");

    for (let index = 0; index < 25; index += 1) {
      const dot = document.createElement("i");
      dot.className = "dot";
      fragment.append(dot);
      dots.push(dot);
    }

    matrix.append(fragment);
    stage.append(matrix);
    shadow.replaceChildren(style, stage);

    let destroyed = false;

    const applyFrame = (timeSeconds) => {
      if (destroyed) return;

      const time = normalizeTime(timeSeconds);
      const dipIn = smoothstep(1.405, 1.535, time);
      const dipOut = 1 - smoothstep(1.595, 1.735, time);
      const centerDip = dipIn * dipOut;

      for (let index = 0; index < dots.length; index += 1) {
        const { distance, proximity } = DOT_METRICS[index];

        const flipProgress = clamp01(
          (time - FLIP_DELAYS[index]) / FLIP_DURATION,
        );
        const flipped = easeInOutCubic(flipProgress);
        const flipEdge = Math.sin(Math.PI * flipProgress);

        const curl = pulse(
          time,
          CURL_START + CURL_ORDER[index] * CURL_STEP,
          CURL_DURATION,
        );

        const returnProgress = clamp01(
          (time - RETURN_START - RETURN_DELAYS[index]) / RETURN_DURATION,
        );
        const returned = easeOutBack(returnProgress);
        const returnEdge = Math.sin(Math.PI * returnProgress);
        const rebound = Math.max(0, returned - 1);

        const depression = centerDip * proximity;
        const centerWeight = index === 12 ? 1 : 0;

        const rotation = 180 * flipped * (1 - returned)
          + curl * CURL_TILTS[index]
          + centerDip * centerWeight * 11;
        const scale = 1
          - flipEdge * 0.055
          + curl * 0.13
          - depression * (0.055 + centerWeight * 0.245)
          - returnEdge * 0.035
          + rebound * 0.7;
        const depth = flipEdge * 0.34
          + curl * 0.82
          - depression * (0.25 + centerWeight * 1.08)
          + returnEdge * 0.18;
        const opacity = Math.max(0.5, Math.min(1,
          0.82
          + flipped * (1 - returned) * 0.15
          - flipEdge * 0.13
          + curl * 0.025
          - depression * (0.03 + centerWeight * 0.16)
          - returnEdge * 0.045,
        ));

        const transform = `translateZ(${depth.toFixed(3)}px) rotateX(${rotation.toFixed(3)}deg) scale(${scale.toFixed(4)})`;
        const opacityValue = opacity.toFixed(4);

        if (transform !== lastTransforms[index]) {
          dots[index].style.transform = transform;
          lastTransforms[index] = transform;
        }
        if (opacityValue !== lastOpacities[index]) {
          dots[index].style.opacity = opacityValue;
          lastOpacities[index] = opacityValue;
        }
      }
    };

    applyFrame(0);

    return {
      render(timeSeconds, deltaSeconds) {
        void deltaSeconds;
        applyFrame(timeSeconds);
      },

      resize(widthCssPixels, heightCssPixels, devicePixelRatio) {
        void devicePixelRatio;
        if (destroyed) return;

        const width = Number.isFinite(widthCssPixels) ? widthCssPixels : 30;
        const height = Number.isFinite(heightCssPixels) ? heightCssPixels : 30;
        const fit = Math.max(0.1, Math.min(1, Math.min(width, height) / 30));
        stage.style.setProperty("--fit", fit.toFixed(4));
      },

      reset() {
        applyFrame(0);
      },

      destroy() {
        if (destroyed) return;
        destroyed = true;
        stage.remove();
        style.remove();
        dots.length = 0;
        lastTransforms.length = 0;
        lastOpacities.length = 0;
      },
    };
  },
};

  })());
  return list;
}

window.__loaderDesigns = makeDesigns();

</script>
  <script type="module">
    const loaders = window.__loaderDesigns;

    const phaseButton = document.getElementById("phase-button");
    const phaseSlot = phaseButton.querySelector(".loader-slot");
    const phaseLabel = phaseButton.querySelector(".loader-label");
    const gallery = document.getElementById("gallery");

    // Phase → design mapping. The site's 25 verbs map naturally onto NDM's
    // engine phases; the reference's own labels are kept so the button looks
    // exactly like the site.
    const PHASES = {
      preparing:    { index: 0,  label: "Gathering" },   // 01 Fibonacci Breather
      recognizing:  { index: 4,  label: "Growing" },     // 05 Living Reaction Seed
      transferring: { index: 3,  label: "Drifting" },    // 04 Curl-Field Comet
      merging:      { index: 2,  label: "Merging" },     // 03 Binary Metaball Mitosis
      subtitles:    { index: 17, label: "Syncing" },     // 18 Contour Choir
      finalizing:   { index: 11, label: "Polishing" },   // 12 Voxel Assembly Line
      completed:    { index: 21, label: "Settling" },    // 22 Sandpile Bloom
      paused:       { index: 14, label: "Paused" },      // 15 Orbital Calligraphy
      failed:       { index: 23, label: "Adjusting" },   // 24 Mechanical Iris
    };

    let records = [];
    let activeRecord = null;
    let rafId = 0;
    let lastTime = 0;

    function ensureInstance(design, slot) {
      try {
        return design.mount(slot);
      } catch (error) {
        console.error(`[${design.name}] failed to mount`, error);
        return { render() {}, resize() {}, reset() {}, destroy() {} };
      }
    }

    function startLoop(record) {
      if (rafId) return;
      lastTime = performance.now();
      function tick(now) {
        const delta = now - lastTime;
        lastTime = now;
        if (record && record.instance) {
          record.instance.render?.(now / 1000, delta / 1000);
        }
        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);
    }

    function stopLoop() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    }

    function setActivePhase(phase) {
      const mapping = PHASES[phase] || PHASES.transferring;
      const design = loaders[mapping.index];
      if (!design) return;

      phaseLabel.textContent = mapping.label;
      // Swap the mounted visual on the phase slot.
      if (activeRecord && activeRecord.design === design) return;
      if (activeRecord) {
        activeRecord.instance?.destroy?.();
        phaseSlot.innerHTML = "";
        activeRecord = null;
      }
      const instance = ensureInstance(design, phaseSlot);
      const bounds = phaseSlot.getBoundingClientRect();
      instance.resize?.(bounds.width, bounds.height, window.devicePixelRatio || 1);
      activeRecord = { design, instance };
      startLoop(activeRecord);
      // Tell the native side the button is ready (labels etc.).
      window.webkit?.messageHandlers?.loaderState?.postMessage({ state: "phase", phase, label: mapping.label });
    }

    function showGallery() {
      phaseButton.style.display = "none";
      gallery.style.display = "flex";
      stopLoop();
      gallery.innerHTML = "";
      records = [];
      loaders.forEach((design, index) => {
        const article = document.createElement("div");
        article.className = "specimen";

        const button = document.createElement("button");
        button.className = "loader-button";
        button.type = "button";
        const content = document.createElement("span");
        content.className = "button-content";
        const slot = document.createElement("span");
        slot.className = "loader-slot";
        slot.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "loader-label";
        label.textContent = design.label ?? "Working";
        const sheen = document.createElement("span");
        sheen.className = "button-sheen";
        sheen.setAttribute("aria-hidden", "true");
        const rim = document.createElement("span");
        rim.className = "button-rim";
        rim.setAttribute("aria-hidden", "true");
        content.append(slot, label);
        button.append(content, sheen, rim);

        const name = document.createElement("h3");
        name.className = "specimen-name";
        name.textContent = design.name;

        article.append(button, name);
        gallery.appendChild(article);

        const instance = ensureInstance(design, slot);
        const bounds = slot.getBoundingClientRect();
        instance.resize?.(bounds.width, bounds.height, window.devicePixelRatio || 1);
        records.push({ design, instance, button });

        // Every gallery button plays its own animation forever — like the site.
        button.addEventListener("click", () => {
          instance.reset?.();
        });
      });
      records.forEach(r => startLoop(r));
    }

    // Native bridge API
    window.ndmLoaders = {
      setPhase(phase) {
        if (gallery.style.display === "flex") return;
        setActivePhase(phase);
      },
      setInteraction(hovered, pressed) {
        phaseButton.classList.toggle("ndm-hover", Boolean(hovered));
        phaseButton.classList.toggle("ndm-pressed", Boolean(pressed));
      },
      setTheme(accentHex, isDark) {
        const match = /^#?([0-9a-f]{6})$/i.exec(accentHex || "");
        if (match) {
          const value = Number.parseInt(match[1], 16);
          const r = (value >> 16) & 255;
          const g = (value >> 8) & 255;
          const b = value & 255;
          const root = document.documentElement.style;
          root.setProperty("--ndm-accent", `rgb(${r}, ${g}, ${b})`);
          root.setProperty("--ndm-accent-border", `rgba(${r}, ${g}, ${b}, ${isDark ? 0.52 : 0.38})`);
          root.setProperty("--ndm-accent-shadow", `rgba(${r}, ${g}, ${b}, ${isDark ? 0.24 : 0.16})`);
        }
        document.documentElement.dataset.appearance = isDark ? "dark" : "light";
      },
      setIdle() {
        stopLoop();
        if (activeRecord) {
          activeRecord.instance?.destroy?.();
          phaseSlot.innerHTML = "";
          activeRecord = null;
        }
        phaseLabel.textContent = "下载";
      },
      showGallery() {
        showGallery();
      },
      showPhaseButton() {
        document.documentElement.dataset.mode = "button";
        phaseButton.style.display = "flex";
        gallery.style.display = "none";
        stopLoop();
      },
      showGlyphOnly() {
        document.documentElement.dataset.mode = "glyph";
        phaseButton.style.display = "flex";
        gallery.style.display = "none";
        const bounds = phaseSlot.getBoundingClientRect();
        activeRecord?.instance?.resize?.(bounds.width, bounds.height, window.devicePixelRatio || 1);
      },
    };

    // Default: show the transferring design so the button is alive on launch.
    setActivePhase("transferring");
    window.webkit?.messageHandlers?.loaderState?.postMessage({ state: "ready" });
  </script>
